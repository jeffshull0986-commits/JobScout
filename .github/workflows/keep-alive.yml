name: Keep Job Scout dashboard awake

# Backstop only. The PRIMARY defence against Render's free tier spinning the
# dashboard down (15 minutes idle, then a ~30-60s wake-up that phone
# browsers give up on) lives in the app itself: server.py self-pings its own
# public URL every 10 minutes, so it never goes idle. See start_keepalive().
#
# This workflow covers the one case a self-ping cannot: a service that is
# *already* asleep, or was stopped by a failed deploy - a sleeping container
# can't ping anything to wake itself.
#
# It deliberately does ONE ping per run and exits, rather than staying alive
# and pinging on a timer. Actions minutes are unlimited on public repos but
# metered on private ones (2,000/month on the Free plan, billed at a
# one-minute minimum per job), so this is sized to stay well inside that
# allowance either way: one short run per trigger costs ~1 minute, and at
# the ~15-25 runs a day GitHub actually delivers that is a few hundred
# minutes a month. A long-running pinger would instead consume tens of
# thousands of minutes and exhaust a private repo's quota in about a day
# and a half.
#
# Note the schedule below is aspirational: GitHub's cron scheduler is
# explicitly best-effort and throttles low-priority schedules hard. This
# workflow's `*/10` cron was measured actually firing every 100-300 minutes,
# many times longer than the 15-minute idle window - which is exactly why it
# is a backstop now and not the mechanism the dashboard depends on.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping dashboard
        env:
          # /healthz sits outside the app's Basic Auth gate, so this is a
          # real 200 rather than the 401 a ping to the root path returns.
          # That lets the check below tell "awake" apart from "broken".
          URL: https://jobscout-qq64.onrender.com/healthz
        run: |
          # A sleeping service can take ~60s to answer while Render wakes it,
          # so allow for that before calling it a failure. Two attempts: the
          # first wakes it, the second confirms it actually came up.
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Dashboard is awake."
              exit 0
            fi
            [ "$attempt" = "1" ] && sleep 15
          done
          echo "::error::Dashboard did not return 200 after two attempts - the Render deploy is probably down, not just asleep."
          exit 1
