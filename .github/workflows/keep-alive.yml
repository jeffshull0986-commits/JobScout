name: Keep Job Scout dashboard awake

# Render's free tier spins a Web Service down after 15 minutes with no
# inbound traffic. This just pings the dashboard on a schedule so it never
# goes idle long enough to sleep, and stays instantly loadable from your
# phone. Any response (even a 401 if DASHBOARD_PASSWORD is set) counts as
# traffic - we don't need to authenticate, just to knock on the door.
#
# Note: GitHub's cron scheduler is best-effort and can drift by several
# minutes on low-activity repos, so this runs every 10 minutes to leave
# margin under Render's 15-minute idle window.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://jobscout-qq64.onrender.com/" || echo "curl_failed")
          echo "Response: $code"
          if [ "$code" = "curl_failed" ]; then
            echo "::warning::Could not reach the dashboard at all (network/DNS failure) - Render deploy may be down, not just asleep."
          fi
